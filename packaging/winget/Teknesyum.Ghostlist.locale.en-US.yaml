ShortDescription: Find and fix the records Windows leaves behind after an uninstall.
Description: |-
  Ghostlist finds the leftovers an uninstall does not clean up: dead uninstall
  entries, broken shortcuts, startup entries pointing at missing files, scheduled
  tasks whose executable is gone, abandoned program folders and staged MSIX
  packages.

  Every change is backed up first and can be reversed. Ghostlist never runs a
  vendor uninstall command, never removes an MSIX package on its own, and never
  touches user documents or saved games. Automatic bulk fixing only applies to
  findings with at least two independent pieces of evidence.
