name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check README version line
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $propsVersion = $props.Project.PropertyGroup.Version
          $lines = @(Get-Content README.md | Where-Object { $_ -match 'v?\d+\.\d+\.\d+' })
          if ($lines.Count -ne 1) {
            Write-Host "::warning::README.md should mention the version on exactly one line, but $($lines.Count) lines carry a version number. Keep Directory.Build.props the single source of truth."
          }
          elseif ($lines[0] -notmatch [regex]::Escape($propsVersion)) {
            Write-Host "::warning::README.md version line does not match Directory.Build.props ($propsVersion). Line: $($lines[0].Trim())"
          }
          else {
            Write-Host "README version line matches Directory.Build.props ($propsVersion)."
          }

      - name: Check winget manifest version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $propsVersion = $props.Project.PropertyGroup.Version
          $failed = $false
          foreach ($file in Get-ChildItem packaging/winget -Filter *.yaml) {
            $line = Get-Content $file.FullName | Where-Object { $_ -match '^PackageVersion:' }
            $value = ($line -replace '^PackageVersion:\s*', '').Trim()
            if ($value -ne $propsVersion) {
              Write-Host "::error::$($file.Name) has PackageVersion $value but Directory.Build.props says $propsVersion."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "winget manifest version matches Directory.Build.props ($propsVersion)."

      - name: Restore
        run: dotnet restore Ghostlist.sln

      - name: Build
        run: dotnet build Ghostlist.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ghostlist.sln -c Release --no-build
