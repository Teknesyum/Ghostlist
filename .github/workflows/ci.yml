name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Ghostlist.sln

      - name: Build
        run: dotnet build Ghostlist.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ghostlist.sln -c Release --no-build
