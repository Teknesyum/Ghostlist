name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Ghostlist.sln -c Release

      - name: Publish desktop app
        run: >
          dotnet publish Ghostlist.App/Ghostlist.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - name: Publish command line
        run: >
          dotnet publish Ghostlist.Cli/Ghostlist.Cli.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/cli

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath Ghostlist-win-x64.zip
          $hash = (Get-FileHash Ghostlist-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Ghostlist-win-x64.zip" | Out-File Ghostlist-win-x64.zip.sha256 -Encoding ascii

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Ghostlist-win-x64.zip
            Ghostlist-win-x64.zip.sha256
          generate_release_notes: true
